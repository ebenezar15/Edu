<title>One Flesh</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..800,0..100,0..1;1,9..144,400..700,0..100,0..1&family=Figtree:ital,wght@0,400..800;1,400..600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: "a garden enclosed" (Song 4:12). Jasmine-white ground, pomegranate red, turmeric, leaf green and henna indigo.
   Leaf-shaped cards (one sharp corner), a sticky header, a left rail of garden beds (menu sheet on phones),
   one plate per section mixing prose, cards and animated diagrams. */
:root {
  --bg: #f4f6f2; --bg2: #e8eee7; --surface: #ffffff; --line: #d2dbd1;
  --ink: #1b231f; --muted: #58675e;
  --rose: #b3263e; --rose-soft: rgba(179,38,62,.08);
  --gold: #a66a00; --gold-soft: rgba(166,106,0,.1);
  --sage: #2c7a50; --sage-soft: rgba(44,122,80,.1);
  --sky: #3d4fa0; --sky-soft: rgba(61,79,160,.09);
  --shadow: 0 14px 36px rgba(27,35,31,.12);
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1512; --bg2: #141c18; --surface: #1a241f; --line: #2b3a32; --ink: #e7eee8; --muted: #9db0a4;
  --rose: #f2697f; --rose-soft: rgba(242,105,127,.13); --gold: #e9b24c; --gold-soft: rgba(233,178,76,.13);
  --sage: #6fd09b; --sage-soft: rgba(111,208,155,.12); --sky: #98a8f4; --sky-soft: rgba(152,168,244,.12);
  --shadow: 0 18px 44px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1512; --bg2: #141c18; --surface: #1a241f; --line: #2b3a32; --ink: #e7eee8; --muted: #9db0a4;
  --rose: #f2697f; --rose-soft: rgba(242,105,127,.13); --gold: #e9b24c; --gold-soft: rgba(233,178,76,.13);
  --sage: #6fd09b; --sage-soft: rgba(111,208,155,.12); --sky: #98a8f4; --sky-soft: rgba(152,168,244,.12);
  --shadow: 0 18px 44px rgba(0,0,0,.5); color-scheme: dark; }
.card, .panel, .case, .stage, .info, .steps li, .tl-i, .dcard { border-radius: var(--r) var(--r) var(--r) 4px !important; }
h1 { font-weight: 700; font-variation-settings: "SOFT" 100, "WONK" 1; letter-spacing: -.02em; }
h1 em { font-style: italic; color: var(--rose); }
.vh { position: relative; padding-left: 18px; border-left: 3px solid var(--rose); }
.lens-g { display: grid; gap: 8px; }
.lrow { display: grid; grid-template-columns: 170px minmax(0,1fr) minmax(0,1fr); gap: 8px; }
.lrow > div { padding: 10px 12px; border-radius: 12px 12px 12px 3px; font-size: 15px; }
.lrow .lt { font-weight: 700; background: var(--bg2); }
.lrow .l-leg { background: var(--gold-soft); } .lrow .l-rel { background: var(--sage-soft); }
.lens-g.m-leg .l-rel, .lens-g.m-rel .l-leg { display: none; }
.lens-g.m-leg .lrow, .lens-g.m-rel .lrow { grid-template-columns: 170px minmax(0,1fr); }
.su circle.c { transition: transform 1.4s cubic-bezier(.5,.05,.2,1); }
.su.union .c1 { transform: translateX(60px); } .su.union .c2 { transform: translateX(-60px); }
.su .gapline { transition: opacity 1s; } .su.union .gapline { opacity: 0; }
@media (max-width: 700px) { .lrow, .lens-g.m-leg .lrow, .lens-g.m-rel .lrow { grid-template-columns: minmax(0,1fr); } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16.5px; line-height: 1.62; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.12; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--gold); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ref { font-family: var(--mono); font-size: 12.5px; color: var(--gold); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand b { font-family: var(--display); font-size: 21px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand b span { color: var(--rose); }
.top-act { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.pbtn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pbtn:hover { color: var(--ink); border-color: var(--gold); }
.pbtn.solid { background: var(--gold); color: var(--bg); border-color: var(--gold); }
.prog { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
#menuBtn { display: none; }

.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); align-self: start; height: calc(100vh - 57px - env(safe-area-inset-top, 0px)); overflow-y: auto;
  border-right: 1px solid var(--line); padding: 14px 10px 40px max(10px, env(safe-area-inset-left, 0px)); }
.rg { margin: 16px 10px 6px; display: flex; align-items: center; gap: 8px; }
.rg i { width: 8px; height: 8px; border-radius: 2px; transform: rotate(45deg); }
.rail a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 15px; line-height: 1.3; }
.rail a:hover { color: var(--ink); background: var(--bg2); }
.rail a[aria-current="page"] { color: var(--ink); background: var(--rose-soft); }
.rail a .seen { font-size: 11px; color: var(--sage); }

main { min-width: 0; padding-block: 28px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.plate { max-width: 1060px; margin: 0 auto; display: grid; gap: 34px; grid-template-columns: minmax(0, 1fr); animation: rise .5s ease both; }
.plate > * { min-width: 0; }
@keyframes rise { from { transform: translateY(10px); opacity: .35; } to { transform: none; opacity: 1; } }
.vh { display: grid; gap: 10px; max-width: 780px; }
.vh h1 { font-size: clamp(34px, 5.2vw, 56px); }
.vh .lede { font-size: 19px; color: var(--muted); max-width: 66ch; }

.sec { display: grid; gap: 16px; }
.sec-h { display: grid; gap: 4px; }
.sec-h h2 { font-size: clamp(25px, 3.2vw, 31px); }
.sec-h .sub { color: var(--muted); max-width: 70ch; }
.prose { display: grid; gap: 12px; max-width: 70ch; }
.prose p { font-size: 17px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.card { display: grid; align-content: start; gap: 7px; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); min-width: 0; }
.card h3 { font-size: 21px; }
.card p { color: var(--muted); font-size: 15.5px; line-height: 1.55; }
.card.link { cursor: pointer; text-align: left; transition: border-color .2s, transform .2s; }
.card.link:hover { border-color: var(--gold); transform: translateY(-2px); }
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.panel { padding: 16px 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--bg2); display: grid; gap: 8px; align-content: start; min-width: 0; }
.panel p, .panel li { font-size: 15.5px; }
.panel ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.k-rose { border-color: color-mix(in srgb, var(--rose) 45%, var(--line)); background: var(--rose-soft); } .k-rose > .label { color: var(--rose); }
.k-sage { border-color: color-mix(in srgb, var(--sage) 45%, var(--line)); background: var(--sage-soft); } .k-sage > .label { color: var(--sage); }
.k-gold { border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); background: var(--gold-soft); } .k-gold > .label { color: var(--gold); }
.k-sky { border-color: color-mix(in srgb, var(--sky) 45%, var(--line)); background: var(--sky-soft); } .k-sky > .label { color: var(--sky); }
.note { padding: 14px 16px; border-left: 3px solid var(--gold); background: var(--gold-soft); border-radius: 0 10px 10px 0; font-size: 16px; max-width: 80ch; }
.note.n-rose { border-color: var(--rose); background: var(--rose-soft); }
.note.n-sage { border-color: var(--sage); background: var(--sage-soft); }
.verses { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.verse { margin: 0; padding: 12px 14px; border-top: 1px solid var(--gold); font-style: italic; background: linear-gradient(var(--gold-soft), transparent 75%); font-size: 15.5px; }
.verse .ref { display: block; font-style: normal; margin-bottom: 3px; }
.acc { border-top: 1px solid var(--line); }
.acc details { border-bottom: 1px solid var(--line); }
.acc summary { cursor: pointer; list-style: none; padding: 13px 34px 13px 0; position: relative; font-weight: 600; font-size: 16.5px; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary::after { content: "+"; position: absolute; right: 6px; top: 10px; font-family: var(--mono); color: var(--gold); font-size: 20px; transition: transform .2s; }
.acc details[open] summary::after { transform: rotate(45deg); }
.acc .ans { padding: 0 0 16px; color: var(--muted); display: grid; gap: 8px; max-width: 75ch; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.steps li::before { content: counter(s); grid-row: span 2; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; color: var(--gold); border: 1px solid var(--gold); }
.steps b { font-weight: 700; } .steps span { color: var(--muted); font-size: 15.5px; }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
.tbl { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 15px; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.tbl thead th { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); background: var(--bg2); }
.tbl tbody th { font-weight: 700; background: var(--bg2); width: 18%; }
.tbl tr:last-child > * { border-bottom: 0; }
.pill { display: inline-block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; background: var(--rose-soft); color: var(--rose); width: max-content; }
.pill.sage { background: var(--sage-soft); color: var(--sage); } .pill.gold { background: var(--gold-soft); color: var(--gold); } .pill.sky { background: var(--sky-soft); color: var(--sky); }

.tabset { display: grid; gap: 14px; }
.tabbar { display: flex; flex-wrap: wrap; gap: 6px; }
.tabbar button, .chip { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 6px 13px; cursor: pointer; font-family: var(--mono); font-size: 11.5px; letter-spacing: .05em; }
.tabbar button:hover, .chip:hover { color: var(--ink); }
.tabbar button[aria-selected="true"], .chip[aria-pressed="true"] { background: var(--rose-soft); color: var(--ink); border-color: var(--rose); }

.case { display: grid; gap: 10px; padding: 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.case h3 { font-size: 22px; }
.case-g { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.case-g div { padding: 10px 12px; border-radius: 8px; background: var(--bg2); font-size: 15px; }
.case-g .label { display: block; margin-bottom: 3px; }

/* widgets */
.stage { border: 1px solid var(--line); border-radius: var(--r); background: var(--bg2); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.stage svg { display: block; width: 100%; height: auto; }
.mm-wrap { overflow-x: auto; }
.mm-wrap svg { min-width: 680px; }
.mm-line { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.6s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.mm-node { cursor: pointer; }
.mm-node:hover circle, .mm-node:focus circle { stroke-width: 3; }
.mm-t { font-family: var(--body); font-size: 13px; fill: var(--ink); }
.mm-g { font-family: var(--display); font-size: 19px; font-weight: 700; }
.paths { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; }

.anat { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.anat svg text { font-family: var(--mono); font-size: 10px; fill: var(--muted); letter-spacing: .06em; }
.spot { cursor: pointer; }
.spot circle.p { fill: var(--gold); }
.spot circle.h { fill: none; stroke: var(--gold); animation: ping 2.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.spot.on circle.p { fill: var(--rose); }
@keyframes ping { from { transform: scale(.6); opacity: 1; } to { transform: scale(2.4); opacity: 0; } }
.aro, .aro-t { transition: transform 1.4s cubic-bezier(.4,.1,.2,1), fill 1.2s, opacity 1.2s; }
.aroused .aro-swell { transform: scale(1.14); }
.aroused .aro-tent { transform: scaleX(1.32) scaleY(1.12); }
.aroused .aro-lift { transform: translateY(-14px); }
.aroused .aro-rise { transform: rotate(-30deg); }
.aroused .aro-up { transform: translateY(-10px); }
.aroused .aro-fill { fill: var(--rose) !important; opacity: .55; }
.info { display: grid; gap: 8px; padding: 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); min-height: 200px; align-content: start; }
.info h3 { font-size: 24px; }
.info p { font-size: 15.5px; }

.rc-ph { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); letter-spacing: .08em; }
.rc-ph.on { fill: var(--gold); }
.rc-band { fill: var(--gold-soft); opacity: 0; transition: opacity .4s; } .rc-band.on { opacity: 1; }
.layers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 185px), 1fr)); gap: 8px; }
.layers .panel { animation: rise .4s both; }
.chem { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 150px; padding: 8px 4px 0; border-bottom: 1px solid var(--line); }
.chem div { display: grid; gap: 4px; justify-items: center; align-content: end; height: 100%; min-width: 0; }
.chem i { display: block; width: 70%; max-width: 34px; border-radius: 5px 5px 0 0; transition: height .9s cubic-bezier(.4,.1,.2,1); }
.chem-l { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; font-family: var(--mono); font-size: 9.5px; color: var(--muted); letter-spacing: .02em; }
.chem-l span { overflow-wrap: anywhere; }

.flow-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fn { display: grid; gap: 2px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; opacity: .55; transition: opacity .4s, border-color .4s, transform .4s, background .4s; max-width: 210px; }
.fn b { font-size: 14px; } .fn small { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.fn.lit { opacity: 1; border-color: var(--rose); background: var(--rose-soft); }
.flow.safe .fn.lit { border-color: var(--sage); background: var(--sage-soft); }
.fn.cur { transform: translateY(-3px); box-shadow: var(--shadow); }
.fa { color: var(--line); font-size: 18px; transition: color .4s; } .fa.lit { color: var(--gold); }
.fdet { padding: 14px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 15.5px; min-height: 60px; animation: rise .3s both; }

.cyc { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 16px; align-items: center; }
.cyc svg text { font-family: var(--body); font-size: 12.5px; fill: var(--ink); font-weight: 600; }
.cyc-n { cursor: pointer; }
.cyc-n circle { fill: var(--surface); stroke: var(--line); stroke-width: 2; transition: stroke .3s, fill .3s; }
.cyc-n.on circle { stroke: var(--gold); fill: var(--gold-soft); }
.cyc-n:hover circle { stroke: var(--gold); }

.meter { height: 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--rose), var(--gold), var(--sage)); transition: width .6s; }
.mcols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip.acc-c[aria-pressed="true"] { background: var(--sage-soft); border-color: var(--sage); }

.crumbs { display: flex; flex-wrap: wrap; gap: 6px; }
.crumb { font-size: 12.5px; color: var(--muted); padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.tq { display: grid; gap: 10px; }
.tq h3 { font-size: 24px; }
.opt { text-align: left; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 15.5px; }
.opt:hover { border-color: var(--gold); }

.deck { display: grid; gap: 12px; justify-items: start; }
.dcard { width: 100%; max-width: 560px; min-height: 190px; padding: 24px; border-radius: 16px; border: 1px solid var(--rose); background: linear-gradient(140deg, var(--rose-soft), var(--gold-soft)); display: grid; align-content: space-between; gap: 14px; animation: flip .5s both; }
.dcard q { quotes: none; font-family: var(--display); font-size: 26px; line-height: 1.25; }
@keyframes flip { from { transform: rotateY(70deg); opacity: 0; } }

.ages input[type=range], .tol input[type=range] { width: 100%; accent-color: var(--rose); }
.age-ticks { display: grid; grid-template-columns: repeat(6, 1fr); font-family: var(--mono); font-size: 10.5px; color: var(--muted); text-align: center; }
.tol-stage { font-family: var(--mono); font-size: 12px; color: var(--gold); }

.tl { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x proximity; }
.tl-i { flex: 0 0 min(300px, 84%); scroll-snap-align: start; display: grid; gap: 8px; align-content: start; padding: 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); position: relative; }
.tl-i::before { content: ""; position: absolute; top: -1px; left: 16px; right: 16px; height: 3px; border-radius: 3px; background: var(--c, var(--gold)); }
.tl-i h3 { font-size: 20px; }
.tl-i p { font-size: 14.5px; color: var(--muted); }
.tl-i .od { display: grid; gap: 6px; }
.tl-i .od div { font-size: 14px; padding: 7px 10px; border-radius: 8px; }

.bars { display: grid; gap: 12px; }
.bar { display: grid; gap: 4px; }
.bar-h { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
.bar-h b { font-family: var(--mono); font-weight: 500; color: var(--gold); font-variant-numeric: tabular-nums; }
.bar-t { height: 10px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.bar-t i { display: block; height: 100%; border-radius: 6px; animation: grow 1.2s cubic-bezier(.4,.1,.2,1) both; }
@keyframes grow { from { width: 0 !important; } }
.bar small { color: var(--muted); font-size: 12.5px; }

.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(6,3,9,.55); }
.msheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 82vh; overflow-y: auto; background: var(--bg); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 30px) max(16px, env(safe-area-inset-left, 0px)); animation: rise .3s both; }
.msheet .rail { position: static; height: auto; border: 0; padding: 0; display: block; }

<script>
/* ============ helpers ============ */
const $ = (s, r = document) => r.querySelector(s);

const cards = (a, cls = '') => `<div class="grid ${cls}">${a.map(c => `<div class="card">${c[2] ? `<span class="label">${c[2]}</span>` : ''}<h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}</div>`;
const acc = a => `<div class="acc">${a.map(([q, x]) => `<details><summary>${q}</summary><div class="ans">${x}</div></details>`).join('')}</div>`;

const tbl = (h, rows) => `<div class="tw"><table class="tbl"><thead><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => i ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`;

const panel = (lab, html, k = '') => `<div class="panel ${k ? 'k-' + k : ''}"><span class="label">${lab}</span>${html}</div>`;
const ul = a => `<ul>${a.map(x => `<li>${x}</li>`).join('')}</ul>`;

/* flow widget: sequential steps that light up */
const FLOWS = {};
function flow(id, a, safe = false) {
  FLOWS[id] = a;
  return `<div class="stage flow ${safe ? 'safe' : ''}" id="${id}"><div class="flow-row">${a.map((s, i) => `${i ? '<span class="fa">&rarr;</span>' : ''}<button class="fn" data-i="${i}"><small>${String(i + 1).padStart(2, '0')}</small><b>${s[0]}</b></button>`).join('')}</div>${play(id)}<div class="fdet">${a[0][1]}</div></div>`;

/* cycle widget: nodes on a ring with an orbiting dot */
const CYCS = {};
function cycle(id, center, nodes) {
  CYCS[id] = nodes;
  const n = nodes.length, R = 140, cx = 190, cy = 190;
  const pts = nodes.map((_, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + R * Math.cos(a), cy + R * Math.sin(a)]; });
  const lab = (t, x, y) => { const w = t.split('|'); return `<text text-anchor="middle" x="${x}" y="${y - (w.length - 1) * 7 + 4}">${w.map((s, k) => `<tspan x="${x}" dy="${k ? 14 : 0}">${s}</tspan>`).join('')}</text>`; };
  return `<div class="stage"><div class="cyc" id="${id}"><svg viewBox="0 0 380 380" role="img" aria-label="${center} cycle diagram">
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 6"/>
    <text x="${cx}" y="${cy - 4}" text-anchor="middle" style="font-family:var(--display);font-size:22px;fill:var(--gold)">${center.split('|')[0]}</text>
    <text x="${cx}" y="${cy + 16}" text-anchor="middle" style="font-size:11px;fill:var(--muted);font-weight:400">${center.split('|')[1] || ''}</text>
    <circle class="orb" r="6" fill="var(--rose)" cx="${cx}" cy="${cy - R}"><title>moving through the cycle</title></circle>
    ${nodes.map((nd, i) => `<g class="cyc-n" data-i="${i}" tabindex="0" role="button"><circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="40"/>${lab(nd[0], pts[i][0], pts[i][1])}</g>`).join('')}
  </svg><div class="info"><span class="label">Tap a stage</span><h3>${nodes[0][0].replace(/\|/g, ' ')}</h3><p>${nodes[0][1]}</p>${nodes[0][2] ? `<div class="note n-sage"><b>Break it here:</b> ${nodes[0][2]}</div>` : ''}</div></div></div>`;
}
function cycleShow(id, i) {
  const el = document.getElementById(id), nd = CYCS[id][i];
  $$('.cyc-n', el).forEach((g, j) => g.classList.toggle('on', j === i));
  $('.info', el).innerHTML = `<span class="label">Stage ${i + 1} of ${CYCS[id].length}</span><h3>${nd[0].replace(/\|/g, ' ')}</h3><p>${nd[1]}</p>${nd[2] ? `<div class="note n-sage"><b>Break it here:</b> ${nd[2]}</div>` : ''}`;

let orbRaf;

  cancelAnimationFrame(orbRaf); if (RM) return;

    $$('.cyc .orb').forEach(o => { const a = -Math.PI / 2 + ((t - t0) / 9000) * 2 * Math.PI; o.setAttribute('cx', 190 + 140 * Math.cos(a)); o.setAttribute('cy', 190 + 140 * Math.sin(a)); });

  };
  orbRaf = requestAnimationFrame(tick);
}

/* ============ navigation ============ */
const NAV = [

function arcSeg(cx, cy, r1, r2, a0, a1) {
  const p = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)], l = a1 - a0 > Math.PI ? 1 : 0;
  const [x1, y1] = p(r2, a0), [x2, y2] = p(r2, a1), [x3, y3] = p(r1, a1), [x4, y4] = p(r1, a0);
  return `M${x1} ${y1} A${r2} ${r2} 0 ${l} 1 ${x2} ${y2} L${x3} ${y3} A${r1} ${r1} 0 ${l} 0 ${x4} ${y4} Z`;
}
